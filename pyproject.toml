[project]
name = "bern02-project"
version = "0.1.0"
description = "Plant reproductive efficiency exploratory data analysis and spatial modeling"
readme = "README.md"
authors = [
    { name = "pompom", email = "je3384la-s@student.lu.se" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fiona~=1.10.0",
    "folium~=0.20.0",
    "geopandas~=1.2.0",
    "ipykernel~=7.4.0",
    "matplotlib~=3.11.0",
    "numpy~=2.2.0",
    "pandas~=3.0.0",
    "rasterio~=1.5.0",
    "scipy~=1.15.0",
    "seaborn~=0.13.0",
    "shapely~=2.2.0",
    "statsmodels~=0.15.0",
    "watermark~=2.6.0",
]

[project.scripts]
bern02-project = "bern02_project:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false